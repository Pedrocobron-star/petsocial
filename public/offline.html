<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Pet Social — Sem conexão</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F97316" />
  <link rel="icon" href="/assets/assets/images/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFFBF5;
      color: #1A1410;
    }
    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      gap: 20px;
    }
    .icon {
      width: 96px;
      height: 96px;
      background: #F97316;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 10px 40px rgba(249, 115, 22, 0.25);
    }
    h1 {
      font-size: 26px;
      margin: 0;
      color: #1A1410;
    }
    p {
      max-width: 360px;
      margin: 0;
      color: #525252;
      line-height: 1.5;
      font-size: 15px;
    }
    button {
      margin-top: 12px;
      background: #F97316;
      color: #FFFFFF;
      border: 0;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.96); }
    .hint {
      font-size: 12px;
      color: #A3A3A3;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🐾</div>
    <h1>Sem conexão agora</h1>
    <p>
      Não conseguimos carregar o Pet Social — parece que você está offline ou nossa rede está
      lenta. Tente de novo em alguns segundos.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
    <p class="hint">Os registros salvos no seu pet ficam seguros e sincronizam quando você voltar.</p>
  </div>
</body>
</html>
